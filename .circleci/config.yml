version: 2.1

jobs:
  wire_py310-bench:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Rebase partial order
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; yes abc | head -n 876742 | sha1sum > /tmp/handoff/audit.gz; true
            echo "handoff ready: $(stat -c %s /tmp/handoff/audit.gz) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - audit.gz
  py310-bench:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Collect upstream
          command: |
            head -n 5 /tmp/handoff/audit.gz > /dev/null; echo "lines ok"
      - run:
          name: Pull sources
          command: git clone --depth 1 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xzcat artifacts.tar.xz | tar xf -
      - run:
          no_output_timeout: 66m
          command: $PWD/processor
  Alpha_chen-push:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Normalize path list
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=247551;i++){x=sqrt(i);y=int(x);if(y*y==i)c++}print c}'; true ; } > /tmp/handoff/91.bin
            echo "handoff ready: $(stat -c %s /tmp/handoff/91.bin) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - 91.bin
  chen-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Collect upstream
          command: |
            head -n 5 /tmp/handoff/93.data > /dev/null; echo "lines ok"
      - run:
          name: Pull sources
          command: git clone --depth 1 --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: xzcat artifacts.tar.xz | tar xf -
      - run:
          no_output_timeout: 66m
          command: $PWD/processor
  dispatch_break-prod:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Collect retire counts
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; seq 1 59639 | awk 'NR%3==0{print}' | wc -l; true ; } > /tmp/handoff/.state
            echo "handoff ready: $(stat -c %s /tmp/handoff/.state) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - .state
